name: flowforge

# Ambiente privado/local; API persiste e solicita despacho. Migrations são explícitas.
services:
  api:
    build:
      context: .
      dockerfile: src/FlowForge.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      FlowForge__DataProtection__KeyRingPath: /var/lib/flowforge/keys
      FlowForge__Telemetry__OtlpEndpoint: ${FLOWFORGE_OTLP_ENDPOINT:-}
      FlowForge__Authentication__AccountPermitLimit: ${FLOWFORGE_ACCOUNT_PERMIT_LIMIT:-120}
      # O nginx do frontend chega pela rede interna do Compose; só dele o X-Forwarded-For é aceito.
      FlowForge__Network__TrustedProxies__0: 172.16.0.0/12
      FlowForge__Network__TrustedProxies__1: 10.0.0.0/8
      FlowForge__Network__TrustedProxies__2: 192.168.0.0/16
      FlowForge__TechnicalOwnerId: ${FLOWFORGE_TECHNICAL_OWNER_ID:-843ca847-7868-4d1c-bd21-fc1db0d224a7}
      FlowForge__Postgres__Host: postgres
      FlowForge__Postgres__Database: flowforge
      FlowForge__Postgres__Username: flowforge
      FlowForge__Postgres__PasswordFile: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLOWFORGE_API_PORT:-5080}:8080"
    init: true
    stop_grace_period: 15s
    volumes:
      - execution_keyring:/var/lib/flowforge/keys

  worker:
    build:
      context: .
      dockerfile: src/FlowForge.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      FlowForge__Telemetry__OtlpEndpoint: ${FLOWFORGE_OTLP_ENDPOINT:-}
      # Lista de origens HTTPS exatas separadas por vírgula; vazio bloqueia todo HTTP externo.
      FlowForge__Http__AllowedOrigins: ${FLOWFORGE_HTTP_ALLOWED_ORIGINS:-}
      FlowForge__DataProtection__KeyRingPath: /var/lib/flowforge/keys
      FlowForge__Postgres__Host: postgres
      FlowForge__Postgres__Database: flowforge
      FlowForge__Postgres__Username: flowforge
      FlowForge__Postgres__PasswordFile: /run/secrets/postgres_password
      FlowForge__RabbitMq__Host: rabbitmq
      FlowForge__RabbitMq__Username: flowforge
      FlowForge__RabbitMq__PasswordFile: /run/secrets/rabbitmq_password
    secrets:
      - postgres_password
      - rabbitmq_password
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    volumes:
      - execution_keyring:/var/lib/flowforge/keys

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
    secrets:
      - rabbitmq_password
    entrypoint: ["/bin/sh", "-ec", 'export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"; exec docker-entrypoint.sh rabbitmq-server']
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPIRE_DASHBOARD_OTLP_AUTH_MODE: Unsecured
    ports:
      - "127.0.0.1:${FLOWFORGE_DASHBOARD_PORT:-18888}:18888"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FLOWFORGE_FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_started
    init: true

volumes:
  postgres_data:
  rabbitmq_data:
  execution_keyring:

secrets:
  postgres_password:
    environment: FLOWFORGE_POSTGRES_PASSWORD

  rabbitmq_password:
    environment: FLOWFORGE_RABBITMQ_PASSWORD
