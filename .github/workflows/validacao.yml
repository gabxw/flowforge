name: Validação do projeto

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - frontend/**
      - scripts/**
      - "*.slnx"
      - global.json
      - .config/dotnet-tools.json
      - Directory.Build.props
      - NuGet.Config
      - compose.yaml
      - .dockerignore
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: validacao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Build e testes do backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependências
        id: restaurar
        run: dotnet restore FlowForge.slnx --locked-mode
      - name: Compilar solução
        run: dotnet build FlowForge.slnx -c Release --no-restore
      - name: Auditar dependências do backend
        run: |
          mkdir -p TestResults
          dotnet list FlowForge.slnx package --vulnerable --include-transitive --no-restore --format json > TestResults/dependency-audit.json
          count=$(jq '[.. | objects | .vulnerabilities? // empty | .[] | select(.severity == "High" or .severity == "Critical")] | length' TestResults/dependency-audit.json)
          test "$count" -eq 0
      - name: Validar migrations
        env:
          FLOWFORGE_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Database=flowforge_design
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/FlowForge.Infrastructure --startup-project src/FlowForge.Infrastructure --configuration Release --no-build
          mkdir -p TestResults
          dotnet ef migrations script --idempotent --project src/FlowForge.Infrastructure --startup-project src/FlowForge.Infrastructure --configuration Release --no-build --output TestResults/migrations.sql
      - name: Executar testes
        run: dotnet test FlowForge.slnx -c Release --no-build -m:1 --logger trx --results-directory TestResults
      - name: Guardar lockfiles e resultados
        if: ${{ !cancelled() && steps.restaurar.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validacao-backend
          path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json
            TestResults/*.trx
            TestResults/migrations.sql
            TestResults/dependency-audit.json
          retention-days: 7

  frontend:
    name: Lint build e jornadas do frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Instalar dependências
        id: instalar
        run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Compilar frontend
        run: npm run build
      - name: Auditar dependências
        run: npm audit --audit-level=high
      - name: Instalar Chromium para testes
        run: npx playwright install --with-deps chromium
      - name: Testar jornadas do frontend
        run: npm test
      - name: Guardar lockfile
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validacao-frontend
          path: |
            frontend/package-lock.json
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  containers:
    name: Ambiente Docker e encerramento do Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Preparar jornada de navegador real
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x
      - name: Validar ambiente completo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FLOWFORGE_POSTGRES_PASSWORD = [Guid]::NewGuid().ToString('N')
          $env:FLOWFORGE_RABBITMQ_PASSWORD = [Guid]::NewGuid().ToString('N')
          $env:FLOWFORGE_HTTP_ALLOWED_ORIGINS = ''
          $env:FLOWFORGE_SMOKE_EMAIL = 'smoke@flowforge.local'
          $env:FLOWFORGE_SMOKE_PASSWORD = [Guid]::NewGuid().ToString('N')
          $env:FLOWFORGE_ACCOUNT_PERMIT_LIMIT = '10000'
          function Invoke-Check([string[]] $Arguments) {
            & docker @Arguments
            if ($LASTEXITCODE -ne 0) { throw "Falha no comando Docker (código $LASTEXITCODE)." }
          }
          try {
            Invoke-Check @('compose', 'config', '--quiet')
            Invoke-Check @('compose', 'build')
            Invoke-Check @('compose', 'run', '--rm', '--no-deps', 'frontend', 'nginx', '-t')
            Invoke-Check @('compose', 'up', '--detach', '--wait', '--wait-timeout', '180')
            ./scripts/migrate-compose.ps1
            ./scripts/migrate-compose.ps1
            ./scripts/smoke-compose.ps1
            ./scripts/smoke-workflows.ps1
            ./scripts/smoke-workflows.ps1 -BaseUri 'http://127.0.0.1:5173'
            ./scripts/smoke-executions.ps1
            ./scripts/smoke-executions.ps1 -BaseUri 'http://127.0.0.1:5173'
            ./scripts/smoke-webhooks.ps1
            ./scripts/smoke-webhooks.ps1 -BaseUri 'http://127.0.0.1:5173'
            ./scripts/smoke-http.ps1
            ./scripts/smoke-http.ps1 -BaseUri 'http://127.0.0.1:5173'
            ./scripts/smoke-declarative.ps1
            ./scripts/smoke-declarative.ps1 -BaseUri 'http://127.0.0.1:5173'
            ./scripts/smoke-reliability.ps1
            ./scripts/smoke-reliability.ps1 -BaseUri 'http://127.0.0.1:5173'
            $env:FLOWFORGE_E2E_BASE_URL = 'http://127.0.0.1:5173'
            npm --prefix frontend run test:backend
            if ($LASTEXITCODE -ne 0) { throw 'Jornada de navegador com API e Worker falhou.' }
            # O volume de keyring deve sobreviver à recriação do Worker sem expor seu conteúdo.
            $pausedDelay = ./scripts/smoke-declarative.ps1 -PausedOnly -DelaySeconds 45
            ./scripts/smoke-executions.ps1 # Consumer permanece disponível durante o Delay.
            Start-Sleep -Milliseconds 500
            $waitingQueue = docker compose exec -T rabbitmq rabbitmqctl list_queues --quiet name messages_unacknowledged
            if ($LASTEXITCODE -ne 0 -or ($waitingQueue -join '') -notmatch 'flowforge\.executions\.v1\s+0') { throw 'Delivery permaneceu aberta durante Delay.' }
            $keyNames = docker compose exec -T worker sh -c 'ls /var/lib/flowforge/keys/key-*.xml'
            if ($LASTEXITCODE -ne 0 -or -not $keyNames) { throw 'Keyring não foi persistido.' }
            Invoke-Check @('compose', 'exec', '-T', 'rabbitmq', 'rabbitmqctl', 'stop_app')
            Invoke-Check @('compose', 'up', '--detach', '--force-recreate', '--no-deps', 'worker')
            Invoke-Check @('compose', 'exec', '-T', 'rabbitmq', 'rabbitmqctl', 'start_app')
            ./scripts/smoke-declarative.ps1 -ExecutionId $pausedDelay.ExecutionId
            ./scripts/smoke-executions.ps1
            $keyNamesAfter = docker compose exec -T worker sh -c 'ls /var/lib/flowforge/keys/key-*.xml'
            if ($LASTEXITCODE -ne 0 -or ($keyNames -join ',') -ne ($keyNamesAfter -join ',')) { throw 'Keyring mudou ao recriar Worker.' }
            $workerId = docker compose ps -q worker
            if ($LASTEXITCODE -ne 0 -or -not $workerId) { throw 'Worker não foi criado.' }
            $workerRunning = docker inspect -f '{{.State.Running}}' $workerId
            if ($LASTEXITCODE -ne 0 -or $workerRunning -ne 'true') { throw 'Worker não está ativo.' }
            Invoke-Check @('compose', 'up', '--detach', '--force-recreate', '--no-deps', 'api')
            $proxyOk = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:5173/api/health/live' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -eq 'Healthy') { $proxyOk = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $proxyOk) { throw 'Proxy não recuperou após recriação da API.' }
            Invoke-Check @('compose', 'stop', '--timeout', '10', 'worker')
            $redrive = ./scripts/smoke-reliability.ps1 -PendingOnly
            Invoke-Check @('compose', 'up', '--detach', '--force-recreate', '--no-deps', 'worker')
            ./scripts/smoke-reliability.ps1 -ExecutionId $redrive.ExecutionId
            # A API aceita sem broker; input inicial precisa sobreviver à recriação de ambos os processos.
            Invoke-Check @('compose', 'exec', '-T', 'rabbitmq', 'rabbitmqctl', 'stop_app')
            $pendingWebhook = ./scripts/smoke-webhooks.ps1 -PendingOnly
            $pendingHttp = ./scripts/smoke-http.ps1 -PendingOnly
            Invoke-Check @('compose', 'up', '--detach', '--force-recreate', '--no-deps', 'api', 'worker')
            Invoke-Check @('compose', 'exec', '-T', 'rabbitmq', 'rabbitmqctl', 'start_app')
            Invoke-Check @('compose', 'up', '--detach', '--wait', '--wait-timeout', '180')
            ./scripts/smoke-webhooks.ps1 -ExecutionId $pendingWebhook.ExecutionId -ExpectedInputBytes $pendingWebhook.ExpectedInputBytes
            ./scripts/smoke-http.ps1 -ExecutionId $pendingHttp.ExecutionId -CredentialId $pendingHttp.CredentialId
            $workerId = docker compose ps -q worker
            if ($LASTEXITCODE -ne 0 -or -not $workerId) { throw 'Worker recriado ausente.' }
            Invoke-Check @('compose', '--profile', 'redis', 'up', '--detach', '--wait', '--wait-timeout', '60', 'redis')
            Invoke-Check @('compose', 'stop', '--timeout', '10', 'worker')
            $workerExit = docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}:{{.State.OOMKilled}}' $workerId
            if ($LASTEXITCODE -ne 0 -or $workerExit -ne 'exited:0:false') { throw 'Worker não encerrou normalmente.' }
            Write-Host 'Ambiente, proxy e encerramento do Worker aprovados.'
          } finally {
            Invoke-Check @('compose', '--profile', 'redis', 'down', '--remove-orphans', '--volumes')
          }
      - name: Guardar resultados da jornada real
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validacao-navegador-backend
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
